AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Email confirmation callback for the registration flow. An HTTP API exposes
  GET /confirm, which resumes a waiting Step Functions execution by sending
  the task token from the confirmation link back via SendTaskSuccess.

Parameters:
  DomainName:
    Type: String
    Description: The registered domain whose hosted zone receives the SES DNS records.
    Default: lcw-sandbox.org
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone id for DomainName.
  FromEmail:
    Type: String
    Description: >
      Address registration emails are sent from, and the inbound address the
      mail forwarder listens on. Must belong to DomainName.
    Default: registration@lcw-sandbox.org
  ForwardTo:
    Type: String
    Description: Verified address that inbound mail for FromEmail forwards to.
    Default: james.chartrand@dccommons.org
  RegistrationCode:
    Type: String
    NoEcho: true
    Description: >
      Code a user must supply on the registration form before the registration
      state machine is started. Override at deploy time; the default is only
      for local development.
    Default: test-registration-code
  SpaceBaseUrl:
    Type: String
    Description: >
      Base URL for Wallet Attached Storage space URLs (typically ending in
      /space). At registration the state machine appends the account's space
      id after a slash and stores the result as the account's spaceURL.
    Default: https://was.example.org/space

Resources:
  ConfirmationHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: lcw-account-email-conf
      # Wildcard origin is safe here: auth is via signed zCap headers, not
      # cookies (AllowCredentials stays false).
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'

  RegistrationEmailConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: registration-email-confirmation
      Description: Confirms a registration email and resumes the Step Functions execution
      CodeUri: src/registration-email-confirmation/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: states:SendTaskSuccess
              Resource: '*'
      Events:
        ConfirmRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConfirmationHttpApi
            Method: GET
            Path: /confirm

  LcwRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lcw-register
      Description: Gates registration on a code, then starts the wallet-account-creator state machine
      CodeUri: src/lcw-register/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          REGISTRATION_CODE: !Ref RegistrationCode
          # Constructed rather than !Ref'd: the state machine references the
          # HTTP API (for ConfirmUrl), and the API embeds this function, so a
          # !Ref here would close a circular dependency. The name is fixed.
          STATE_MACHINE_ARN: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:wallet-account-creator
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: wallet-account-creator
      LoggingConfig:
        LogGroup: !Ref RegisterFunctionLogGroup
      Events:
        RegisterRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConfirmationHttpApi
            Method: POST
            Path: /register

  RegisterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/lcw-register
      RetentionInDays: 30

  LcwLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lcw-login
      Description: Verifies a zCap HTTP-signature capability invocation for login by email
      CodeUri: src/lcw-login/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref WalletTestTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WalletTestTable
      LoggingConfig:
        LogGroup: !Ref LoginFunctionLogGroup
      Events:
        LoginRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConfirmationHttpApi
            Method: POST
            Path: /login
    Metadata:
      # Bundling resolves the CJS require of the ESM @interop/http-client at
      # build time; the Lambda runtime refuses it at runtime (ERR_REQUIRE_ESM).
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node22
        Sourcemap: false
        EntryPoints:
          - index.mjs
        External:
          - '@aws-sdk/*'

  LoginFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/lcw-login
      RetentionInDays: 30

  WalletAccountCreatorStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: wallet-account-creator
      Type: STANDARD
      Role: arn:aws:iam::747170788015:role/service-role/StepFunctions-wallet-account-creator-role-khki9937v
      DefinitionSubstitutions:
        ConfirmUrl: !Sub https://${ConfirmationHttpApi}.execute-api.${AWS::Region}.amazonaws.com/confirm
        SpaceUrlBase: !Ref SpaceBaseUrl
        AccountTable: !Ref WalletTestTable
        FromEmail: !Ref FromEmail
      Definition:
        Comment: DCC LCW registration state machine
        QueryLanguage: JSONata
        StartAt: SendEmailVerification
        States:
          SendEmailVerification:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:sesv2:sendEmail.waitForTaskToken
            Arguments:
              FromEmailAddress: ${FromEmail}
              Destination:
                ToAddresses:
                  - '{% $states.input.recipientEmail %}'
              Content:
                Simple:
                  Subject:
                    Data: DCC LCW - Please Confirm Your Email Address
                  Body:
                    Html:
                      Data: "{% 'Please click the link to approve: ${ConfirmUrl}?token=' & $states.context.Task.Token %}"
            Next: GenerateBucketName
          GenerateBucketName:
            Type: Pass
            Assign:
              BucketName: "{% 'dcc-was-' & $uuid() %}"
            Next: CreateS3Bucket
          CreateS3Bucket:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:s3:createBucket
            Arguments:
              Bucket: '{% $BucketName %}'
            Next: SeedSpaceDescription
          # The WAS server reads the space description from
          # metadata/description.json; without one the UI falls back to the
          # bare space id.
          SeedSpaceDescription:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:s3:putObject
            Arguments:
              Bucket: '{% $BucketName %}'
              Key: metadata/description.json
              ContentType: application/json
              Body: >-
                {% $string({"name": $states.context.Execution.Input.recipientEmail & "'s Space", "type": ["Space"], "controller": $states.context.Execution.Input.did, "createdBy": $states.context.Execution.Input.did}) %}
            Next: CreateAccount
          CreateAccount:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Arguments:
              TableName: ${AccountTable}
              Item:
                email:
                  S: '{% $states.context.Execution.Input.recipientEmail %}'
                did:
                  S: '{% $states.context.Execution.Input.did %}'
                spaceURL:
                  S: "{% '${SpaceUrlBase}/' & $BucketName %}"
                CreatedAt:
                  S: '{% $now() %}'
            Next: UploadInitialVCToS3
          UploadInitialVCToS3:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:s3:putObject
            Arguments:
              Bucket: '{% $BucketName %}'
              Key: credentials/hello-world.txt
              Body: This file was generated directly by an AWS Step Functions workflow.
            Next: SendEmailConf
          SendEmailConf:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:sesv2:sendEmail
            Arguments:
              FromEmailAddress: ${FromEmail}
              Destination:
                ToAddresses:
                  - '{% $states.context.Execution.Input.recipientEmail %}'
              Content:
                Simple:
                  Subject:
                    Data: DCC LCW - Your Wallet is Ready
                  Body:
                    Text:
                      Data: "{% 'You have been registered! Your storage space: ${SpaceUrlBase}/' & $BucketName %}"
            End: true

  WalletTestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wallet-test
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/registration-email-confirmation
      RetentionInDays: 30

  # ---- lcw-sandbox.org email: send as FromEmail, forward inbound to ForwardTo

  SesDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName

  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesDomainIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: '3600'
      ResourceRecords:
        - !GetAtt SesDomainIdentity.DkimDNSTokenValue1

  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesDomainIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: '3600'
      ResourceRecords:
        - !GetAtt SesDomainIdentity.DkimDNSTokenValue2

  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesDomainIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: '3600'
      ResourceRecords:
        - !GetAtt SesDomainIdentity.DkimDNSTokenValue3

  # Inbound mail lands at SES via this MX record...
  InboundMxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: MX
      TTL: '3600'
      ResourceRecords:
        - 10 inbound-smtp.us-east-1.amazonaws.com

  # ...is stored here by the receipt rule...
  InboundMailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub lcw-inbound-mail-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: expire-forwarded-mail
            Status: Enabled
            ExpirationInDays: 30

  InboundMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InboundMailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${InboundMailBucket.Arn}/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ...and forwarded on by this function.
  MailForwarderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lcw-mail-forwarder
      Description: Forwards inbound lcw-sandbox.org mail to the configured address
      CodeUri: src/mail-forwarder/
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 128
      Timeout: 15
      Environment:
        Variables:
          MAIL_BUCKET: !Ref InboundMailBucket
          FORWARD_FROM: !Ref FromEmail
          FORWARD_TO: !Ref ForwardTo
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref InboundMailBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  MailForwarderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailForwarderFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  MailReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: lcw-sandbox-inbound

  # NOTE: CloudFormation cannot activate a receipt rule set; after deploy run
  #   aws ses set-active-receipt-rule-set --rule-set-name lcw-sandbox-inbound
  MailReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - InboundMailBucketPolicy
      - MailForwarderInvokePermission
    Properties:
      RuleSetName: !Ref MailReceiptRuleSet
      Rule:
        Name: forward-registration
        Enabled: true
        Recipients:
          - !Ref FromEmail
        ScanEnabled: true
        Actions:
          - S3Action:
              BucketName: !Ref InboundMailBucket
              ObjectKeyPrefix: inbound/
          - LambdaAction:
              FunctionArn: !GetAtt MailForwarderFunction.Arn
              InvocationType: Event

Outputs:
  ConfirmUrl:
    Description: URL for the email confirmation link (append ?token=...)
    Value: !Sub https://${ConfirmationHttpApi}.execute-api.${AWS::Region}.amazonaws.com/confirm
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt RegistrationEmailConfirmationFunction.Arn
  RegisterUrl:
    Description: URL for the code-gated registration endpoint (POST)
    Value: !Sub https://${ConfirmationHttpApi}.execute-api.${AWS::Region}.amazonaws.com/register
  LoginUrl:
    Description: URL for the zCap-authenticated login endpoint (POST)
    Value: !Sub https://${ConfirmationHttpApi}.execute-api.${AWS::Region}.amazonaws.com/login
  StateMachineArn:
    Description: Wallet account creator state machine ARN
    Value: !Ref WalletAccountCreatorStateMachine
